name: Build macOS App Bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            artifact: ChromIQ-macOS-arm64.dmg
            target_arch_env: ''

          - runner: macos-latest
            arch: universal2
            artifact: ChromIQ-macOS-universal.dmg
            target_arch_env: 'universal2'

    steps:
      - uses: actions/checkout@v4

      # arm64 job: use setup-python with the same Python version as local dev
      - name: Set up Python (arm64)
        if: matrix.arch == 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # universal2 job: use Python.org's official universal2 installer so that
      # pip downloads universal2 wheels for all packages, giving us fat binaries
      # that PyInstaller can bundle into a single universal2 app.
      - name: Set up Python (universal2 via python.org installer)
        if: matrix.arch == 'universal2'
        run: |
          curl -fsSL -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/3.12.9/python-3.12.9-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pyinstaller

      - name: Use pure-Python PyYAML (universal2 only — avoids arm64-only C extension)
        if: matrix.arch == 'universal2'
        run: pip3 install --force-reinstall --no-binary PyYAML PyYAML

      - name: Build app bundle
        env:
          PYINSTALLER_TARGET_ARCH: ${{ matrix.target_arch_env }}
        run: python3 -m PyInstaller ChromIQ.spec

      - name: Re-sign bundle (ad-hoc deep sign)
        run: codesign --deep --force --sign - dist/ChromIQ.app

      - name: Create DMG
        run: |
          mkdir -p /tmp/dmg_src
          ditto dist/ChromIQ.app /tmp/dmg_src/ChromIQ.app
          ln -s /Applications /tmp/dmg_src/Applications
          hdiutil create -volname "ChromIQ" \
            -srcfolder /tmp/dmg_src \
            -ov -format UDZO -fs HFS+ \
            "${{ matrix.artifact }}"

      - name: Create GitHub Release (if not exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "ChromIQ $TAG" \
              --notes "Open the DMG, drag ChromIQ to Applications, eject, then launch from Applications. First launch: right-click -> Open (bypasses Gatekeeper). Requires macOS 12+ and ArgyllCMS 3.5.0 at /Applications/Argyll/bin."
          fi

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.artifact }}" --clobber
