name: Build macOS App Bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            zip_name: ChromIQ-macOS-arm64.zip
          - runner: macos-13
            arch: x86_64
            zip_name: ChromIQ-macOS-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app bundle
        run: python -m PyInstaller ChromIQ.spec

      - name: Package as zip
        run: cd dist && zip -r ../${{ matrix.zip_name }} ChromIQ.app

      - name: Create GitHub Release (if not exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "ChromIQ $TAG" \
              --notes "Download the zip for your Mac, unzip, and move ChromIQ.app to Applications. First launch: right-click → Open (bypasses Gatekeeper). Requires macOS 12+ and ArgyllCMS 3.5.0 at /Applications/Argyll/bin."
          fi

      - name: Upload artifact to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.zip_name }}" --clobber
