name: Build macOS App Bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            artifact: ChromIQ-macOS-arm64.dmg
          - runner: macos-13
            arch: x86_64
            artifact: ChromIQ-macOS-x86_64.dmg

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app bundle
        run: python -m PyInstaller ChromIQ.spec

      - name: Create DMG
        run: |
          mkdir -p /tmp/dmg_src
          cp -r dist/ChromIQ.app /tmp/dmg_src/
          ln -s /Applications /tmp/dmg_src/Applications
          hdiutil create -volname "ChromIQ" \
            -srcfolder /tmp/dmg_src \
            -ov -format UDZO -fs HFS+ \
            "${{ matrix.artifact }}"

      - name: Create GitHub Release (if not exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "ChromIQ $TAG" \
              --notes "Open the DMG, drag ChromIQ to Applications, eject, then launch from Applications. First launch: right-click -> Open (bypasses Gatekeeper). Requires macOS 12+ and ArgyllCMS 3.5.0 at /Applications/Argyll/bin."
          fi

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.artifact }}" --clobber
