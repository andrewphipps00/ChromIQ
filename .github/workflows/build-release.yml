name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:   # allows manual test builds without creating a release

jobs:
  # ── 1. Build native bundles on each architecture ─────────────────────────
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15   # Apple Silicon
            label: arm64
          - os: macos-13   # Intel x86_64
            label: intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build app bundle
        run: pyinstaller ChromIQ.spec --clean

      - name: Archive bundle (preserves permissions & symlinks)
        run: tar -czf ChromIQ-${{ matrix.label }}.tar.gz -C dist ChromIQ.app

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: ChromIQ-${{ matrix.label }}.tar.gz
          retention-days: 1

  # ── 2. Merge, sign, package DMGs, publish release ─────────────────────────
  package:
    name: Package & Release
    needs: build
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract bundles
        run: |
          mkdir -p bundles/arm64 bundles/intel bundles/universal
          tar -xzf artifacts/bundle-arm64/ChromIQ-arm64.tar.gz -C bundles/arm64
          tar -xzf artifacts/bundle-intel/ChromIQ-intel.tar.gz -C bundles/intel

      - name: Build universal bundle
        run: |
          cp -R bundles/arm64/ChromIQ.app bundles/universal/ChromIQ.app
          find bundles/arm64/ChromIQ.app -type f | while IFS= read -r arm_file; do
            rel="${arm_file#bundles/arm64/ChromIQ.app/}"
            intel_file="bundles/intel/ChromIQ.app/$rel"
            univ_file="bundles/universal/ChromIQ.app/$rel"
            if [ -f "$intel_file" ] && file "$arm_file" | grep -q "Mach-O"; then
              lipo -create -output "$univ_file" "$arm_file" "$intel_file" 2>/dev/null || true
            fi
          done

      - name: Ad-hoc sign all bundles
        run: |
          for variant in arm64 intel universal; do
            app="bundles/$variant/ChromIQ.app"
            find "$app" \( -name "*.dylib" -o -name "*.so" \) -print0 \
              | xargs -0 -I{} codesign --force --sign - "{}" 2>/dev/null || true
            codesign --deep --force --sign - "$app"
          done

      - name: Create DMGs
        run: |
          for variant in arm64 intel universal; do
            mkdir -p "staging/$variant"
            cp -R "bundles/$variant/ChromIQ.app" "staging/$variant/"
            ln -sf /Applications "staging/$variant/Applications"
            hdiutil create \
              -volname "ChromIQ" \
              -srcfolder "staging/$variant" \
              -ov -format UDZO \
              "ChromIQ-macOS-$variant.dmg"
          done

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ChromIQ-macOS-arm64.dmg
            ChromIQ-macOS-intel.dmg
            ChromIQ-macOS-universal.dmg
          generate_release_notes: true
