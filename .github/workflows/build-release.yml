name: Build macOS App Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v2.0.2)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            artifact: ChromIQ-macOS-arm64.dmg
            target_arch_env: ''

          - arch: universal2
            artifact: ChromIQ-macOS-universal.dmg
            target_arch_env: 'universal2'

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # arm64 job: GitHub-hosted Python 3.13 (stable, arm64)
      - name: Set up Python (arm64)
        if: matrix.arch == 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # universal2 job: python.org official universal2 installer so that pip
      # fetches universal2 wheels for all packages, giving fat binaries that
      # PyInstaller can bundle into a single universal2 app.
      - name: Set up Python (universal2 via python.org installer)
        if: matrix.arch == 'universal2'
        run: |
          curl -fsSL -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/3.13.3/python-3.13.3-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.13/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pyinstaller

      # pycups has no macOS wheel; build from source as a fat binary.
      - name: Force universal2 fat binaries (universal2 only)
        if: matrix.arch == 'universal2'
        run: |
          ARCHFLAGS="-arch x86_64 -arch arm64" pip3 install --force-reinstall --no-binary pycups pycups

      # imagecodecs dropped x86_64 wheels in 2026; pin to last version that still has one.
      - name: Pin imagecodecs to last x86_64-compatible version (universal2 only)
        if: matrix.arch == 'universal2'
        run: pip3 install --quiet 'imagecodecs==2025.11.11'

      # numpy, Pillow, PyYAML, imagecodecs, PyQt6-Qt6 and PyQt6-WebEngine-Qt6 ship
      # only arch-specific wheels — no universal2 exists on PyPI for any of them.
      # Strategy: query PyPI JSON API for each package's x86_64 wheel, download it,
      # and lipo-merge every Mach-O binary with the arm64 file already installed
      # by pip, matching by relative path inside the wheel/site-packages tree.
      # We match Mach-O files (not just *.so / *.dylib) because PyQt6-Qt6 ships
      # framework binaries with no extension at e.g.
      # PyQt6/Qt6/lib/QtGui.framework/Versions/A/QtGui — the original extension
      # filter missed those, leaving the universal2 DMG arm64-only for Qt itself.
      # lipo_pkg args: <PyPI name> <site-packages dir> <version tag filter>
      #   ver_filter must appear in the wheel filename to select the right Python
      #   version. Use "cp313" for cpython-tagged wheels, "abi3" for stable-ABI
      #   wheels, "py3-none" for pure-tag arch-specific wheels (PyQt6-Qt6 etc).
      - name: Make C extensions universal2 via lipo (universal2 only)
        if: matrix.arch == 'universal2'
        run: |
          SITELIB=$(python3 -c "import site; print(site.getsitepackages()[0])")
          lipo_pkg() {
            local pypi_name="$1" pkg_dir="$2" ver_filter="$3"
            local VER X86_URL TMPDIR safe x86_root arm_root rel arm_file merged=0
            VER=$(python3 -c "import importlib.metadata; print(importlib.metadata.version('${pypi_name}'))")
            X86_URL=$(curl -fsSL "https://pypi.org/pypi/${pypi_name}/${VER}/json" | \
              python3 -c "import json,sys; vf='${ver_filter}'; d=json.load(sys.stdin); w=[f['url'] for f in d['urls'] if 'macosx' in f['filename'] and 'x86_64' in f['filename'] and vf in f['filename'] and f['filename'].endswith('.whl')]; print(w[0] if w else '')")
            if [ -z "$X86_URL" ]; then
              echo "No x86_64 wheel for ${pypi_name} ${VER} — skipping lipo"
              return 0
            fi
            echo "Downloading x86_64 wheel for ${pypi_name} ${VER}: $X86_URL"
            safe="${pkg_dir//\//_}"
            TMPDIR="/tmp/${safe}_x86"
            rm -rf "$TMPDIR"
            mkdir -p "$TMPDIR"
            curl -fsSL -o "/tmp/${safe}.whl" "$X86_URL"
            unzip -q "/tmp/${safe}.whl" -d "$TMPDIR"
            x86_root="$TMPDIR/${pkg_dir}"
            arm_root="${SITELIB}/${pkg_dir}"
            if [ ! -d "$x86_root" ]; then
              echo "ERROR: ${pkg_dir} not found in x86_64 wheel for ${pypi_name}"
              return 1
            fi
            while IFS= read -r x86_file; do
              [ -f "$x86_file" ] || continue
              case "$(file -b "$x86_file" 2>/dev/null)" in
                Mach-O*) ;;
                *) continue ;;
              esac
              rel="${x86_file#$x86_root/}"
              arm_file="$arm_root/$rel"
              if [ -f "$arm_file" ] && lipo -create "$arm_file" "$x86_file" -output "$arm_file" 2>/dev/null; then
                merged=$((merged + 1))
              fi
            done < <(find "$x86_root" -type f)
            echo "Merged $merged Mach-O binaries for ${pypi_name}"
          }
          lipo_pkg numpy                numpy        cp313
          lipo_pkg Pillow               PIL          cp313
          lipo_pkg PyYAML               yaml         cp313
          lipo_pkg imagecodecs          imagecodecs  abi3
          lipo_pkg PyQt6-Qt6            PyQt6/Qt6    py3-none
          lipo_pkg PyQt6-WebEngine-Qt6  PyQt6/Qt6    py3-none

      - name: Build app bundle
        env:
          PYINSTALLER_TARGET_ARCH: ${{ matrix.target_arch_env }}
        run: python3 -m PyInstaller ChromIQ.spec

      - name: Codesign app (ad-hoc)
        run: |
          # Sign bottom-up: leaf binaries first, then frameworks, then the app.
          # Avoid --deep: it re-signs internals after we've already signed them,
          # which can corrupt the code directory on Apple Silicon.
          find dist/ChromIQ.app -type f \( -name "*.so" -o -name "*.dylib" \) \
            -exec codesign --force --sign - {} \;
          find dist/ChromIQ.app -name "*.framework" -type d \
            -exec codesign --force --sign - {} \;
          find dist/ChromIQ.app -name "*.bundle" -type d \
            -exec codesign --force --sign - {} \;
          codesign --force --sign - dist/ChromIQ.app

      - name: Verify app signature
        run: codesign --verify --verbose dist/ChromIQ.app

      - name: Create DMG
        run: |
          # Two-step approach — avoids hdiutil create -srcfolder hanging on
          # GitHub Actions runners when bundling large app bundles.
          APP_MB=$(du -sm dist/ChromIQ.app | awk '{print $1}')
          IMG_MB=$((APP_MB + 40))

          # Step 1: writable sparse image
          hdiutil create -megabytes "$IMG_MB" \
            -volname "ChromIQ" -fs HFS+ /tmp/rw.dmg

          # Step 2: mount it
          MOUNT=$(hdiutil attach /tmp/rw.dmg -nobrowse -noautoopen \
            | awk '/Apple_HFS/{print $NF}')

          # Step 3: populate
          ditto dist/ChromIQ.app "$MOUNT/ChromIQ.app"
          ln -sf /Applications "$MOUNT/Applications"
          sync

          # Step 4: detach
          hdiutil detach "$MOUNT" -force

          # Step 5: convert to compressed read-only (UDZO = zlib)
          hdiutil convert /tmp/rw.dmg \
            -format UDZO -imagekey zlib-level=9 \
            -o "${{ matrix.artifact }}"

          rm -f /tmp/rw.dmg

      - name: Codesign DMG (ad-hoc)
        run: codesign --sign - "${{ matrix.artifact }}"

      - name: Create GitHub Release (if not exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            body=$(awk "/^## ${TAG}$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md 2>/dev/null | sed '/^[[:space:]]*$/d' || true)
            {
              printf '%s\n\n---\n' "$body"
              printf '**Installation:** Open the DMG, drag ChromIQ to Applications, eject, then launch.\n\n'
              printf 'ChromIQ is ad-hoc signed (not notarized). On macOS Sonoma+ the right-click → Open trick often fails with *"Apple cannot check it for malicious software."* If that happens, remove the quarantine flag in Terminal:\n\n'
              printf '```\nxattr -dr com.apple.quarantine /Applications/ChromIQ.app\n```\n\n'
              printf 'Then double-click as normal.\n\n'
              printf 'Requires macOS 12+ and ArgyllCMS 3.5.0 at `/Applications/Argyll/bin`.'
            } > /tmp/release_notes.txt
            gh release create "$TAG" \
              --title "ChromIQ $TAG" \
              --notes-file /tmp/release_notes.txt
          fi

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "${{ matrix.artifact }}" --clobber
