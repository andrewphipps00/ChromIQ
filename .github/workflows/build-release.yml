name: Build macOS App Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.1.4)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            artifact: ChromIQ-macOS-arm64.dmg
            target_arch_env: ''

          - runner: macos-latest
            arch: universal2
            artifact: ChromIQ-macOS-universal.dmg
            target_arch_env: 'universal2'

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # arm64 job: use setup-python with the same Python version as local dev
      - name: Set up Python (arm64)
        if: matrix.arch == 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # universal2 job: use Python.org's official universal2 installer so that
      # pip downloads universal2 wheels for all packages, giving us fat binaries
      # that PyInstaller can bundle into a single universal2 app.
      - name: Set up Python (universal2 via python.org installer)
        if: matrix.arch == 'universal2'
        run: |
          curl -fsSL -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/3.12.9/python-3.12.9-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pyinstaller

      - name: Force universal2 fat binaries (universal2 only)
        if: matrix.arch == 'universal2'
        run: |
          # PyYAML: pure-Python fallback avoids arm64-only C extension
          pip3 install --force-reinstall --no-binary PyYAML PyYAML
          # Pillow: build from source with both archs so .so files are fat binaries
          ARCHFLAGS="-arch x86_64 -arch arm64" pip3 install --force-reinstall --no-binary Pillow Pillow

      - name: Build app bundle
        env:
          PYINSTALLER_TARGET_ARCH: ${{ matrix.target_arch_env }}
        run: python3 -m PyInstaller ChromIQ.spec

      - name: Re-sign bundle (ad-hoc deep sign)
        run: codesign --deep --force --sign - dist/ChromIQ.app

      - name: Create DMG
        run: |
          mkdir -p /tmp/dmg_src
          ditto dist/ChromIQ.app /tmp/dmg_src/ChromIQ.app
          ln -s /Applications /tmp/dmg_src/Applications
          hdiutil create -volname "ChromIQ" \
            -srcfolder /tmp/dmg_src \
            -ov -format UDZO -fs HFS+ \
            "${{ matrix.artifact }}"

      - name: Create GitHub Release (if not exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            python3 - <<'PYEOF'
import re, os

tag = os.environ["RELEASE_TAG"]

try:
    text = open("CHANGELOG.md").read()
    m = re.search(r"(?m)^## " + re.escape(tag) + r"\n(.*?)(?=^## |\Z)", text, re.DOTALL)
    body = m.group(1).strip() if m else ""
except FileNotFoundError:
    body = ""

install = (
    "\n\n---\n"
    "**Installation:** Open the DMG, drag ChromIQ to Applications, eject, then launch. "
    "First launch: right-click → Open (bypasses Gatekeeper). "
    "Requires macOS 12+ and ArgyllCMS 3.5.0 at `/Applications/Argyll/bin`."
)

with open("/tmp/release_notes.txt", "w") as f:
    f.write(body + install)
PYEOF
            gh release create "$TAG" \
              --title "ChromIQ $TAG" \
              --notes-file /tmp/release_notes.txt
          fi

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "${{ matrix.artifact }}" --clobber
